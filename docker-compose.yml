version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: medvision_ai
      MYSQL_USER: medvision
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-medvision_dev_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://medvision:${MYSQL_PASSWORD:-medvision_dev_pass}@mysql:3306/medvision_ai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_ml_artifacts:/app/app/ml_artifacts
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    command: >
      sh -c "alembic upgrade head &&
             python -c \"import os; exit(0 if os.path.exists('app/ml_artifacts/vision_demo_model.joblib') else 1)\" ||
             python scripts/train_vision_model.py &&
             python scripts/seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://medvision:${MYSQL_PASSWORD:-medvision_dev_pass}@mysql:3306/medvision_ai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - backend_uploads:/app/uploads
      - backend_ml_artifacts:/app/app/ml_artifacts
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    # Note: Added client_max_body_size 50m to nginx.conf for large uploads
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  backend_uploads:
  backend_ml_artifacts:
